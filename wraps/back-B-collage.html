<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mal's Famous — Back Wrap B: Photo Collage</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Montserrat:wght@400;600;700;800;900&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; background:#222; }
  body { display:flex; align-items:center; justify-content:center; }

  .wrap {
    width: 2000px; height: 1200px;
    position: relative;
    background: #0A0A0A;
    color: #F5F0E8;
    font-family: 'Montserrat', sans-serif;
    overflow: hidden;
  }

  /* Background photo collage — full bleed */
  .collage {
    position: absolute; inset: 0;
    display: grid;
    grid-template-columns: 1fr 1.2fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 6px;
  }
  .collage > div {
    overflow: hidden;
    position: relative;
  }
  .collage img { width:100%; height:100%; object-fit:cover; display:block; }
  /* Slight gold-tinted overlay so the photos feel cohesive */
  .collage > div::after {
    content:'';
    position:absolute; inset:0;
    background: linear-gradient(180deg, rgba(0,0,0,0.0), rgba(10,7,0,0.25));
  }

  /* Dark vignette to make centerpiece pop — gentler so photos still read */
  .vignette {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse 50% 60% at 50% 50%, rgba(10,7,0,0.78) 0%, rgba(10,7,0,0.35) 55%, rgba(10,7,0,0.1) 100%);
  }

  /* Gold border frame */
  .frame {
    position: absolute;
    inset: 22px;
    border: 5px solid #D4A017;
    opacity: 0.8;
    box-shadow: 0 0 80px rgba(212,160,23,0.25) inset;
    pointer-events: none;
  }
  .frame-inner {
    position: absolute;
    inset: 36px;
    border: 1px solid rgba(212,160,23,0.5);
    pointer-events: none;
  }

  /* Centerpiece */
  .center {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    width: 1100px;
    z-index: 5;
  }
  .center-eyebrow {
    font-size: 18px; letter-spacing: 10px;
    color: #D4A017;
    text-transform: uppercase;
    font-weight: 800;
    margin-bottom: 18px;
  }
  .center-logo { width: 480px; margin: 0 auto 22px; display:block; filter: drop-shadow(0 0 30px rgba(212,160,23,0.55)); }
  .center h1 {
    font-family: 'Playfair Display', serif;
    font-size: 92px; font-weight: 900; line-height: 0.95;
    color: #F0C040;
    letter-spacing: 1px;
    text-shadow: 0 4px 18px rgba(0,0,0,0.7), 0 0 50px rgba(212,160,23,0.3);
    display: none; /* logo carries the wordmark */
  }
  .center .divider {
    width: 200px; height: 2px;
    background: linear-gradient(90deg, transparent, #D4A017, transparent);
    margin: 14px auto 18px;
  }
  .center .tag {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 36px;
    color: #F5F0E8;
    letter-spacing: 1px;
    text-shadow: 0 2px 12px rgba(0,0,0,0.7);
  }
  .badges {
    display: flex; gap: 16px; justify-content: center;
    margin-top: 24px;
  }
  .badge {
    background: rgba(212,160,23,0.15);
    border: 1px solid rgba(212,160,23,0.55);
    color: #F0C040;
    font-size: 13px; font-weight: 800;
    letter-spacing: 3px; text-transform: uppercase;
    padding: 8px 18px;
    border-radius: 2px;
    backdrop-filter: blur(4px);
  }

  /* Bottom strip */
  .bottom-strip {
    position: absolute;
    bottom: 60px; left: 50%;
    transform: translateX(-50%);
    background: rgba(10,10,10,0.85);
    border: 2px solid #D4A017;
    border-radius: 10px;
    padding: 18px 28px;
    display: flex; align-items: center; gap: 28px;
    backdrop-filter: blur(6px);
    z-index: 5;
  }
  .qr-box {
    background: #F5F0E8;
    padding: 6px;
    border-radius: 6px;
    width: 110px; height: 110px;
    display:flex; align-items:center; justify-content:center;
  }
  .qr-box img { width:100%; height:100%; }
  .scan-text {
    display: flex; flex-direction: column;
    border-right: 1px solid rgba(212,160,23,0.4);
    padding-right: 28px;
  }
  .scan-text .big {
    font-family: 'Playfair Display', serif;
    font-size: 32px; font-weight: 900;
    color: #F0C040; letter-spacing: 3px;
    line-height: 1;
    text-transform: uppercase;
  }
  .scan-text .sm {
    font-size: 12px; letter-spacing: 4px;
    color: rgba(245,240,232,0.6);
    text-transform: uppercase;
    margin-top: 6px;
  }
  .contact-block {
    display: flex; flex-direction: column;
    gap: 6px;
  }
  .crow { display: flex; align-items: center; gap: 12px; }
  .crow .lbl { font-size: 10px; letter-spacing: 3px; text-transform: uppercase; color: rgba(212,160,23,0.75); font-weight: 700; min-width: 70px; }
  .crow .val { font-family: 'Playfair Display', serif; font-size: 26px; font-weight: 800; color: #F5F0E8; letter-spacing: 1px; line-height: 1; }
  .crow .val.gold { color: #F0C040; }
</style>
</head>
