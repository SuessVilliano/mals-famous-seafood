<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mal's Famous Seafood &amp; Grill – Menu</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Montserrat:wght@400;500;600;700;800&display=swap');
  :root{--gold:#D4A017;--gold-lt:#F0C040;--gold-dk:#A07810;--black:#0C0C0C;--card-bg:#161616;--card-border:rgba(212,160,23,0.18);--white:#F5F0E8;--muted:rgba(245,240,232,0.5);--tab-bg:#111111;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Montserrat',sans-serif;background:var(--black);color:var(--white);min-height:100vh;}
  .hero{background:linear-gradient(160deg,#1a1400 0%,#0C0C0C 60%);text-align:center;padding:64px 24px 48px;position:relative;overflow:hidden;border-bottom:1px solid var(--card-border);}
  .hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 60% 40% at 50% 0%,rgba(212,160,23,0.12) 0%,transparent 70%);}
  .hero-eyebrow{font-size:11px;letter-spacing:5px;color:var(--gold);text-transform:uppercase;font-weight:700;margin-bottom:12px;position:relative;}
  .hero h1{font-family:'Playfair Display',serif;font-size:clamp(36px,8vw,64px);color:var(--gold-lt);line-height:1;text-shadow:0 0 40px rgba(212,160,23,0.35);position:relative;}
  .hero h1 span{display:block;font-size:clamp(18px,4vw,28px);color:var(--white);letter-spacing:6px;margin-top:6px;}
  .hero-rule{width:80px;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:20px auto;}
  .hero-sub{font-size:13px;color:var(--muted);letter-spacing:2px;position:relative;}
  .badge-row{display:flex;justify-content:center;gap:12px;margin-top:24px;flex-wrap:wrap;position:relative;}
  .badge{background:rgba(212,160,23,0.12);border:1px solid rgba(212,160,23,0.3);color:var(--gold);font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;padding:6px 14px;border-radius:2px;}
  .cat-tabs{position:sticky;top:0;z-index:100;background:var(--tab-bg);border-bottom:1px solid var(--card-border);overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
  .cat-tabs::-webkit-scrollbar{display:none;}
  .cat-tabs-inner{display:flex;gap:0;min-width:max-content;padding:0 16px;}
  .tab-btn{background:none;border:none;color:var(--muted);font-family:'Montserrat',sans-serif;font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;padding:16px 18px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:color 0.2s,border-color 0.2s;}
  .tab-btn:hover{color:var(--gold-lt);}
  .tab-btn.active{color:var(--gold);border-bottom-color:var(--gold);}
  .content{max-width:820px;margin:0 auto;padding:48px 20px 80px;}
  .section{margin-bottom:56px;scroll-margin-top:60px;}
  .section-header{display:flex;align-items:center;gap:14px;margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid var(--card-border);}
  .section-icon{font-size:28px;}
  .section-header h2{font-family:'Playfair Display',serif;font-size:26px;color:var(--gold);letter-spacing:1px;}
  .section-count{font-size:11px;color:var(--muted);letter-spacing:2px;margin-left:auto;}
  .items-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px;}
  .item-card{background:var(--card-bg);border:1px solid var(--card-border);border-radius:4px;padding:18px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;transition:border-color 0.2s,background 0.2s;cursor:default;}
  .item-card:hover{border-color:rgba(212,160,23,0.45);background:#1e1a10;}
  .item-card-left{flex:1;}
  .item-card-name{font-size:15px;font-weight:700;color:var(--white);letter-spacing:0.3px;}
  .item-card-desc{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.4;}
  .item-card-price{font-size:15px;font-weight:800;color:var(--gold);white-space:nowrap;min-width:50px;text-align:right;}
  .drinks-row{display:flex;flex-wrap:wrap;gap:10px;}
  .drink-chip{background:var(--card-bg);border:1px solid var(--card-border);border-radius:3px;padding:12px 20px;display:flex;align-items:center;gap:14px;min-width:170px;transition:border-color 0.2s;}
  .drink-chip:hover{border-color:rgba(212,160,23,0.4);}
  .drink-chip .item-card-name{font-size:14px;}
  .brand-badge{width:100%;max-width:500px;display:block;margin:0 auto;filter:drop-shadow(0 0 24px rgba(212,160,23,0.28));}
  .order-cta{background:linear-gradient(135deg,#1a1400,#0f0c00);border:1px solid var(--gold);border-radius:6px;text-align:center;padding:40px 24px;margin-top:48px;}
  .order-cta h3{font-family:'Playfair Display',serif;font-size:24px;color:var(--gold-lt);margin-bottom:8px;}
  .order-cta p{font-size:13px;color:var(--muted);margin-bottom:24px;letter-spacing:1px;}
  .btn-gold{display:inline-block;background:var(--gold);color:#000;font-family:'Montserrat',sans-serif;font-weight:800;font-size:13px;letter-spacing:3px;text-transform:uppercase;text-decoration:none;padding:14px 36px;border-radius:2px;transition:background 0.2s;}
  .btn-gold:hover{background:var(--gold-lt);}
  footer{text-align:center;padding:32px 20px;border-top:1px solid var(--card-border);font-size:12px;color:var(--muted);letter-spacing:2px;}
  footer .social{color:var(--gold);font-weight:700;margin-bottom:6px;}
</style>
</head>
<body>
<div class="hero">
  <svg class="brand-badge" viewBox="0 0 540 290" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <clipPath id="bd-clip"><circle cx="270" cy="145" r="128"/></clipPath>
      <linearGradient id="bd-gold" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#F8E070"/><stop offset="40%" stop-color="#D4A017"/><stop offset="100%" stop-color="#9A7010"/>
      </linearGradient>
    </defs>
    <circle cx="270" cy="145" r="128" fill="#060400"/>
    <g clip-path="url(#bd-clip)">
      <line x1="142" y1="17" x2="398" y2="17" stroke="#D4A017" stroke-width="1.7" opacity="0.38"/>
      <line x1="142" y1="49" x2="398" y2="49" stroke="#D4A017" stroke-width="1.7" opacity="0.38"/>
      <line x1="142" y1="81" x2="398" y2="81" stroke="#D4A017" stroke-width="1.7" opacity="0.38"/>
      <line x1="142" y1="113" x2="398" y2="113" stroke="#D4A017" stroke-width="1.7" opacity="0.38"/>
      <line x1="142" y1="145" x2="398" y2="145" stroke="#D4A017" stroke-width="1.7" opacity="0.38"/>
      <line x1="142" y1="177" x2="398" y2="177" stroke="#D4A017" stroke-width="1.7" opacity="0.38"/>
      <line x1="142" y1="209" x2="398" y2="209" stroke="#D4A017" stroke-width="1.7" opacity="0.38"/>
      <line x1="142" y1="241" x2="398" y2="241" stroke="#D4A017" stroke-width="1.7" opacity="0.38"/>
    </g>
    <circle cx="270" cy="145" r="128" fill="none" stroke="url(#bd-gold)" stroke-width="5"/>
    <circle cx="270" cy="145" r="120" fill="none" stroke="url(#bd-gold)" stroke-width="1.2" opacity="0.5"/>
    <text x="270" y="131" text-anchor="middle" font-family="'Arial Black','Impact',sans-serif" font-weight="900" font-size="50" fill="url(#bd-gold)" letter-spacing="1.5">MAL'S FAMOUS</text>
    <line x1="153" y1="142" x2="387" y2="142" stroke="#D4A017" stroke-width="2" opacity="0.9"/>
    <line x1="153" y1="176" x2="387" y2="176" stroke="#D4A017" stroke-width="2" opacity="0.9"/>
    <text x="270" y="166" text-anchor="middle" font-family="'Arial Black','Impact',sans-serif" font-weight="800" font-size="17" fill="url(#bd-gold)" letter-spacing="4">–SEAFOOD · &amp; · GRILL–</text>
  </svg>
  <div class="hero-rule" style="margin-top:20px;"></div>
  <div class="hero-sub">Fresh &amp; Flavorful · Made to Order</div>
  <div class="badge-row">
    <div class="badge">🦀 Seafood</div>
    <div class="badge">🌮 Tacos</div>
    <div class="badge">🍟 Fries</div>
    <div class="badge">🥡 Catering Available</div>
  </div>
</div>
<div class="cat-tabs" id="cat-tabs-bar"><div class="cat-tabs-inner" id="cat-tabs-inner"></div></div>
<div class="content" id="menu-content"></div>
<footer>
  <div class="social">@MalsFamousSeafood</div>
  <p>Catering Available &nbsp;·&nbsp; Follow for Daily Location Updates</p>
</footer>
<script>
const DEFAULT_MENU_DATA={categories:[
  {id:"seafood",name:"Seafood",emoji:"🦀",items:[{id:"snowcrab",name:"Snowcrab Seafood Broil",price:45,priceNote:"",available:true},{id:"shrimp-rice",name:"Shrimp over Rice",price:15,priceNote:"",available:true},{id:"salmon-rice",name:"Salmon over Rice",price:17,priceNote:"",available:true}]},
  {id:"steak",name:"Steak",emoji:"🥩",items:[{id:"cheesesteak",name:"Cheesesteak",price:15,priceNote:"",available:true},{id:"chicken-cheesesteak",name:"Chicken Cheesesteak",price:14,priceNote:"",available:true}]},
  {id:"tacos",name:"Tacos",emoji:"🌮",items:[{id:"salmon-tacos",name:"Salmon Tacos",price:6,priceNote:"$6 each · 3 for $15",available:true},{id:"shrimp-tacos",name:"Shrimp Tacos",price:6,priceNote:"$6 each · 3 for $15",available:true}]},
  {id:"fish",name:"Fish",emoji:"🐟",items:[{id:"fish-fries",name:"Fish & Fries",price:20,priceNote:"",available:true},{id:"shrimp-fries",name:"Shrimp & Fries",price:20,priceNote:"",available:true},{id:"fish-hoagie",name:"Fish Hoagie",price:15,priceNote:"",available:true},{id:"fried-fish-rice",name:"Fried Fish over Rice",price:15,priceNote:"",available:true}]},
  {id:"chicken",name:"Chicken",emoji:"🍗",items:[{id:"wings-fries",name:"Wings & Fries",price:15,priceNote:"",available:true},{id:"chicken-rice",name:"Chicken over Rice",price:15,priceNote:"",available:true}]},
  {id:"fries",name:"Fries",emoji:"🍟",items:[{id:"crab-fries",name:"Crab Fries",price:15,priceNote:"",available:true},{id:"cheese-fries",name:"Cheese Fries",price:6,priceNote:"",available:true},{id:"regular-fries",name:"Regular Fries",price:5,priceNote:"",available:true}]},
  {id:"sides",name:"Sides",emoji:"🥡",items:[{id:"rice",name:"Rice",price:5,priceNote:"",available:true},{id:"salmon-egg-roll",name:"Salmon Egg Roll",price:13,priceNote:"",available:true},{id:"crab-egg-roll",name:"Crab Egg Roll",price:15,priceNote:"",available:true}]},
  {id:"drinks",name:"Drinks",emoji:"🥤",items:[{id:"pineapple-iced-tea",name:"Pineapple Iced Tea",price:3,priceNote:"",available:true},{id:"soda",name:"Soda",price:2,priceNote:"",available:true},{id:"water",name:"Water",price:2,priceNote:"",available:true}]}
]};
const DESCRIPTIONS={"snowcrab":"Our signature snow crab feast — broiled to perfection with bold seasoning","shrimp-rice":"Tender seasoned shrimp served over fluffy white rice","salmon-rice":"Flavorful salmon fillet served over steamed white rice","cheesesteak":"Classic Philly-style cheesesteak on a toasted roll","chicken-cheesesteak":"Tender chicken with melted cheese on a hoagie roll","salmon-tacos":"Fresh salmon with toppings in a warm flour tortilla","shrimp-tacos":"Seasoned shrimp loaded in a warm flour tortilla","fish-fries":"Golden fried fish served with crispy seasoned fries","shrimp-fries":"Crispy fried shrimp with seasoned fries","fish-hoagie":"Loaded fried fish on a toasted hoagie roll","fried-fish-rice":"Golden fried fish served over fluffy white rice","wings-fries":"Crispy wings your way, served with seasoned fries","chicken-rice":"Seasoned chicken served over fluffy white rice","crab-fries":"Seasoned fries loaded with crab — a crowd favorite","cheese-fries":"Crispy fries smothered in melted cheese","regular-fries":"Classic salted crispy fries","salmon-egg-roll":"Crispy egg roll stuffed with seasoned salmon","crab-egg-roll":"Crispy egg roll packed with savory crab"};
function getMenuData(){try{const s=localStorage.getItem('mals_menu_data');if(s)return JSON.parse(s);}catch(e){}return DEFAULT_MENU_DATA;}
function fmtPrice(item){if(item.priceNote)return item.priceNote;return'$'+(Number.isInteger(item.price)?item.price:item.price.toFixed(2));}
function renderMenu(){
  const data=getMenuData();
  const availCats=data.categories.filter(c=>c.items.some(i=>i.available));
  document.getElementById('cat-tabs-inner').innerHTML=availCats.map((cat,i)=>'<button class="tab-btn '+(i===0?'active':'')+'" data-target="'+cat.id+'" onclick="scrollToSection(\''+cat.id+'\',this)">'+cat.name+'</button>').join('');
  const content=document.getElementById('menu-content');
  let html='';
  availCats.forEach(cat=>{
    const items=cat.items.filter(i=>i.available);
    html+='<div class="section" id="'+cat.id+'"><div class="section-header"><span class="section-icon">'+cat.emoji+'</span><h2>'+cat.name+'</h2><span class="section-count">'+items.length+' item'+(items.length!==1?'s':'')+'</span></div>';
    if(cat.id==='drinks'){
      html+='<div class="drinks-row">';
      items.forEach(item=>{html+='<div class="drink-chip"><div><div class="item-card-name">'+item.name+'</div></div><div class="item-card-price" style="margin-left:auto;">'+fmtPrice(item)+'</div></div>';});
      html+='</div>';
    }else{
      html+='<div class="items-grid">';
      items.forEach(item=>{
        const desc=DESCRIPTIONS[item.id]||'';
        html+='<div class="item-card"><div class="item-card-left"><div class="item-card-name">'+item.name+'</div>'+(desc?'<div class="item-card-desc">'+desc+'</div>':'')+'</div><div class="item-card-price">'+fmtPrice(item)+'</div></div>';
      });
      html+='</div>';
    }
    html+='</div>';
  });
  html+='<div class="order-cta"><h3>Ready to Order?</h3><p>Find us on DoorDash, Uber Eats, or follow us for daily location updates</p><a href="tel:3023842469" class="btn-gold">Call to Order</a></div>';
  content.innerHTML=html;
  const sections=document.querySelectorAll('.section');
  const tabBtns=document.querySelectorAll('.tab-btn');
  const obs=new IntersectionObserver(entries=>{entries.forEach(e=>{if(e.isIntersecting)tabBtns.forEach(t=>t.classList.toggle('active',t.dataset.target===e.target.id));});},{rootMargin:'-40% 0px -55% 0px'});
  sections.forEach(s=>obs.observe(s));
}
function scrollToSection(id,btn){document.getElementById(id).scrollIntoView({behavior:'smooth'});document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');}
renderMenu();
<\/script>
<script src="https://widgets.leadconnectorhq.com/loader.js" data-resources-url="https://widgets.leadconnectorhq.com/chat-widget/loader.js" data-widget-id="6a10c4a7fbf00cbb1c410aa6"><\/script>
</body>
</html>
