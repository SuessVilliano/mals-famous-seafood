<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mal's Famous Seafood</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Georgia', serif;
    background-color: #121212;
    color: #f0f0f0;
    overflow-x: hidden;
  }

  :root {
    --gold: #d4af37;
    --dark-gold: #b8962e;
    --cream: #f5f0e8;
    --dark-bg: #121212;
    --card-bg: #1e1e1e;
  }

  .navbar {
    position: fixed;
    top: 0;
    width: 100%;
    background: rgba(18, 18, 18, 0.95);
    backdrop-filter: blur(10px);
    padding: 1rem 2rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 1000;
    border-bottom: 1px solid rgba(212, 175, 55, 0.3);
  }

  .nav-logo {
    font-size: 1.5rem;
    font-weight: 700;
    color: #d4af37;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .nav-links {
    display: flex;
    gap: 2rem;
    list-style: none;
  }

  .nav-links a {
    color: #f0f0f0;
    text-decoration: none;
    font-size: 0.9rem;
    letter-spacing: 1px;
    text-transform: uppercase;
    transition: color 0.3s;
  }

  .nav-links a:hover {
    color: #d4af37;
  }

  .hero {
    height: 100vh;
    background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.5)), url('https://images.unsplash.com/photo-1555966-083910081738-9fee8c4664bf?w=2000&q=80');
    background-size: cover;
    background-position: center;
    display: flex;
    align-items: center;
    padding: 0rem 3rem;
  }

  .hero-content {
    max-width: 700px;
  }

  .hero-subtitle {
    font-size: 1.1rem;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #d4af37;
    margin-bottom: 1rem;
  }

  .hero-title {
    font-size: clamp(2rem, 6vw, 5rem);
    font-weight: 700;
    line-height: 1.2;
    margin-bottom: 1.5rem;
    text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.5);
  }

  .hero-description {
    font-size: 1.1rem;
    line-height: 1.8;
    color: #d0d0d0;
    margin-bottom: 2rem;
    max-width: 500px;
  }

  .btn-primary {
    background: #d4af37;
    color: #121212;
    padding: 1rem 2.5rem;
    border: none;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.3s;
    text-decoration: none;
    display: inline-block;
  }

  .btn-primary:hover {
    background: #b8962e;
    transform: translateY(-2px);
  }

  .section {
    padding: 6rem 3rem;
    max-width: 1200px;
    margin: 0 auto;
  }

  .section-title {
    font-size: 2rem;
    font-weight: 700;
    color: #d4af37;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 1rem;
  }

  .section-divider {
    width: 60px;
    height: 3px;
    background: #d4af37;
    margin-bottom: 3rem;
  }

  .about-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4rem;
    align-items: center;
  }

  .about-text p {
    font-size: 1.1rem;
    line-height: 1.8;
    color: #d0d0d0;
    margin-bottom: 1.5rem;
  }

  .about-image {
    width: 100%;
    height: 400px;
    object-fit: cover;
  }

  .menu-filters {
    display: flex;
    gap: 1rem;
    justify-content: center;
    margin-bottom: 3rem;
    flex-wrap: wrap;
  }

  .filter-btn {
    padding: 0.5rem 1.5rem;
    background: transparent;
    border: 1px solid rgba(212, 175, 55, 0.5);
    color: #f0f0f0;
    cursor: pointer;
    letter-spacing: 1px;
    text-transform: uppercase;
    font-size: 0.8rem;
    transition: all 0.3s;
  }

  .filter-btn.active, .filter-btn:hover {
    background: #d4af37;
    color: #121212;
    border-color: #d4af37;
  }

  .menu-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 2rem;
  }

  .menu-card {
    background: #1e1e1e;
    border: 1px solid rgba(212, 175, 55, 0.2);
    overflow: hidden;
    transition: transform 0.3s;
  }

  .menu-card:hover {
    transform: translateY(-4px);
  }

  .menu-card-img {
    width: 100%;
    height: 200px;
    object-fit: cover;
  }

  .menu-card-body {
    padding: 1.5rem;
  }

  .menu-card-tag {
    font-size: 0.75rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #d4af37;
    margin-bottom: 0.5rem;
  }

  .menu-card-name {
    font-size: 1.3rem;
    font-weight: 700;
    margin-bottom: 0.5rem;
  }

  .menu-card-description {
    color: #a0a0a0;
    font-size: 0.9rem;
    line-height: 1.6;
    margin-bottom: 1rem;
  }

  .menu-card-price {
    font-size: 1.2rem;
    font-weight: 700;
    color: #d4af37;
  }

  .gallery-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(2, 250px);
    gap: 1rem;
  }

  .gallery-item {
    overflow: hidden;
    position: relative;
  }

  .gallery-item:first-child {
    grid-row: span 2;
  }

  .gallery-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.5s;
  }

  .gallery-item:hover img {
    transform: scale(1.1);
  }

  .testimonials-section {
    background: #1e1e1e;
    padding: 6rem 3rem;
  }

  .testimonials-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 2rem;
    max-width: 1200px;
    margin: 0 auto;
  }

  .testimonial-card {
    background: #121212;
    padding: 2rem;
    border-left: 3px solid #d4af37;
  }

  .testimonial-text {
    font-style: italic;
    color: #d0d0d0;
    line-height: 1.8;
    margin-bottom: 1rem;
  }

  .testimonial-author {
    font-weight: 700;
    color: #d4af37;
  }

  .reservation-section {
    background: linear-gradient(rgba(0, 0, 0, 0.8), rgba(0, 0, 0, 0.8)), url('https://images.unsplash.com/photo-1553361-282457550708-c3b88278e139?w=2000&q=80');
    background-size: cover;
    background-position: center;
    padding: 6rem 3rem;
    text-align: center;
  }

  .reservation-form {
    max-width: 600px;
    margin: 2 auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
  }

  input, select, textarea {
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(212, 175, 55, 0.3);
    color: #f0f0f0;
    padding: 0.75rem 1rem;
    font-size: 1rem;
    width: 100%;
    outline: none;
  }

  input::placeholder, textarea::placeholder {
    color: #808080;
  }

  .form-full {
    grid-column: 1 / -1;
  }

  .contact-section {
    background: #1e1e1e;
    padding: 6rem 3rem;
  }

  .contact-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4rem;
    max-width: 1200px;
    margin: 0 auto;
  }

  .contact-item {
    display: flex;
    align-items: flex-start;
    gap: 1rem;
    margin-bottom: 2rem;
  }

  .contact-icon {
    font-size: 1.5rem;
    min-width: 40px;
  }

  .contact-label {
    font-size: 0.8rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #d4af37;
    margin-bottom: 0.25rem;
  }

  .hours-grid {
    display: grid;
    gap: 0.75rem;
  }

  .hours-row {
    display: flex;
    justify-content: space-between;
    padding-bottom: 0.75rem;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    color: #d0d0d0;
  }

  .footer {
    background: #0a0a0a;
    padding: 3rem;
    text-align: center;
    color: #606060;
    font-size: 0.9rem;
  }

  .footer-logo {
    font-size: 1.5rem;
    font-weight: 700;
    color: #d4af37;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 1rem;
  }

  @media (max-width: 768px) {
    .nav-links {
      display: none;
    }

    .about-grid, .contact-grid {
      grid-template-columns: 1fr;
    }

    .gallery-grid {
      grid-template-columns: 1fr;
      grid-template-rows: auto;
    }

    .gallery-item:first-child {
      grid-row: span 1;
    }

    .reservation-form {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>
<body>

  <div class="nav-logo">Mal's Famous Seafood</div>
  <ul class="nav-links">

    <li><a href="#menu">Menu</a></li>
    <li><a href="#gallery">Gallery</a></li>
    <li><a href="#reservations">Reservations</a></li>
